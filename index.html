<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAIMSHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1a;--card:#12152a;--ink:#f4f5fb;--mute:#8b90ab;--line:#232845;--acc:#ff2d55;--accink:#fff;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b7a;--glow:rgba(255,45,85,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px 110px}
.top{text-align:center;margin:4px 0 18px}
.topill{display:inline-block;padding:8px 22px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;letter-spacing:.5px}
.top::after{content:"";display:block;width:64px;height:3px;border-radius:3px;background:var(--acc);margin:10px auto 0;box-shadow:0 0 12px var(--glow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 0 24px rgba(0,0,0,.18)}
.tile{aspect-ratio:1/1;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;overflow:hidden;border:1px solid var(--line)}
.tile span{font-weight:700;font-style:italic;font-size:22px;line-height:1.1;color:#fff;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.pt{font-weight:700;font-size:16px;margin:10px 2px 8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.pill{flex:1;font-size:13px;font-weight:600;padding:6px 8px;border:1px solid var(--line);border-radius:99px;text-align:center;background:var(--bg)}
.pr{background:var(--acc);color:var(--accink);font-weight:700;padding:6px 12px;border-radius:99px;font-size:14px;white-space:nowrap}
.fs,.bn{width:100%;font:inherit;font-weight:700;border-radius:99px;padding:10px;cursor:pointer;margin-top:6px}
.fs{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.bn{border:0;background:var(--acc);color:var(--accink);box-shadow:0 6px 18px var(--glow)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:600;padding:4px 2px;cursor:pointer}
nav button i{font-style:normal;font-size:22px;line-height:1.2}
nav button[aria-selected="true"]{color:var(--acc)}
nav .badge{position:absolute;top:0;right:22%;margin:0}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-style:normal;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:22px;font-weight:700;color:var(--acc)}
.mute{color:var(--mute);font-size:14px}
.btn{border:0;background:var(--acc);color:var(--accink);padding:10px 16px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.tag{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.t-p{color:var(--warn)}.t-a{color:var(--ok)}.t-r{color:var(--bad)}
.key{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--acc);padding:10px;border-radius:10px;word-break:break-all;white-space:pre-wrap;margin-top:8px}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-weight:500}
.msg.e{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.msg.s{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pay{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.pay b{font-size:18px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet>div{background:var(--card);width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:20px}
h2{font-size:19px;margin:18px 0 8px}
.lnk{display:block;text-align:center;text-decoration:none;font-weight:700;padding:11px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);margin-top:8px}
.lnk.main{background:var(--acc);color:var(--accink)}
.plan{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.plan.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg))}
.stp{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.stp i{font-style:normal;background:var(--acc);color:var(--accink);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.stp b{font-size:19px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;align-items:center;gap:8px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.chip span{flex:1;font-weight:600}
.chip b{color:var(--ok)}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg));box-shadow:0 0 14px var(--glow)}
.chip.on .dot{background:var(--acc)}
.vid{width:100%;margin-top:12px;font:inherit;font-weight:700;padding:12px;border-radius:99px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid var(--acc);color:var(--acc);cursor:pointer}
.qty{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:99px;padding:4px 6px;background:var(--bg)}
.qty button{background:transparent;border:0;color:var(--ink);font-size:22px;width:34px;cursor:pointer}
.qty span{font-weight:700;min-width:16px;text-align:center}
.ip{border:1px solid var(--acc);border-radius:16px;overflow:hidden;box-shadow:0 0 20px var(--glow)}
.ipt{padding:22px 10px;text-align:center;font-size:20px;background:var(--bg)}
.ipb{background:var(--acc);color:var(--accink);text-align:center;font-weight:700;padding:10px;letter-spacing:.5px}
.tile.mini{width:64px;flex:none;padding:4px;border-radius:12px}
.tile.mini span{font-size:20px}
.rule{margin:6px 0}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.tile.hasimg{padding:0}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;text-align:center}
.logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 8px;border:1px solid var(--line)}
.brand{font-weight:700;font-size:22px;letter-spacing:1.5px}
</style>
</head>

<script>
var PROFIT=5,KEY="panelstore2",tab="shop";
var store={products:[],orders:[],users:[],me:null,adminPass:"",pay:{bkash:"01XXXXXXXXX",nagad:"01XXXXXXXXX"}};
function mk(id,name,desc,pl){return {id:id,name:name,desc:desc,panel:"https://example.com/panel",vpn:"https://example.com/vpn",plans:pl.map(function(x,i){return {id:id*10+i,label:x[0],sup:x[1],keys:x[2]||[]}})}}
function load(){try{var s=localStorage.getItem(KEY);if(s){store=JSON.parse(s);return}}catch(e){}
  store.products=[
    mk(1,"ফ্রি ফায়ার প্যানেল A","সহজে চলে, নতুন প্লেয়ারদের জন্য ভালো।",[["১ ঘণ্টা",10,["DEMO-A1-0001","DEMO-A1-0002"]],["৩ ঘণ্টা",25,["DEMO-A3-0001"]],["৭ ঘণ্টা",50,[]]]),
    mk(2,"ফ্রি ফায়ার প্যানেল B","বেশি সেটিংসহ প্রো প্যানেল।",[["১ ঘণ্টা",15,[]],["৩ ঘণ্টা",35,[]],["৭ ঘণ্টা",70,[]]])
  ]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function H(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function fix(){store.users=store.users||[];store.orders=store.orders||[];if(!store.adminPass)store.adminPass=H("admin123");if(store.me===undefined)store.me=null}
function openAuth(){
  var up=window._mode==="up";
  document.getElementById("modal").innerHTML='<div class="sheet"><div><div class="row"><b style="font-size:19px">'+(up?"নতুন একাউন্ট":"লগইন")+'</b><button class="btn alt" id="b-cancel">বন্ধ</button></div>'
  +'<div class="row" style="gap:6px;margin-top:10px"><button class="btn'+(up?' alt':'')+'" data-at="in" style="flex:1">লগইন</button><button class="btn'+(up?'':' alt')+'" data-at="up" style="flex:1">নতুন একাউন্ট</button></div>'
  +(up?'<label>আপনার নাম</label><input id="a-name">':'')
  +'<label>মোবাইল নাম্বার</label><input id="a-ph" autocapitalize="none" placeholder="01XXXXXXXXX">'
  +'<label>পাসওয়ার্ড</label><input id="a-pw" type="password">'
  +'<div id="a-msg"></div><button class="btn" id="a-ok" style="width:100%;margin-top:14px">'+(up?"একাউন্ট খুলুন":"লগইন করুন")+'</button></div></div>';
}
function doAuth(){
  var up=window._mode==="up",ph=bn2en(document.getElementById("a-ph").value).trim().toLowerCase(),pw=document.getElementById("a-pw").value;
  function err(m){showMsg("a-msg",m,"e")}
  if(!ph||!pw){err("নাম্বার আর পাসওয়ার্ড দিন।");return}
  if(up){
    if(!/^01\d{9}$/.test(ph)){err("সঠিক ১১ ডিজিটের মোবাইল নাম্বার দিন।");return}
    if(pw.length<4){err("পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের দিন।");return}
    if(store.users.some(function(u){return u.ph===ph})){err("এই নাম্বারে আগেই একাউন্ট আছে, লগইন করুন।");return}
    store.users.push({ph:ph,name:document.getElementById("a-name").value.trim()||ph,pw:H(pw)});store.me=ph;
  }else if(ph==="admin"){
    if(H(pw)!==store.adminPass){err("নাম্বার বা পাসওয়ার্ড ভুল।");return}
    store.me="admin";tab="admin";
  }else{
    var u=store.users.find(function(x){return x.ph===ph});
    if(!u||u.pw!==H(pw)){err("নাম্বার বা পাসওয়ার্ড ভুল।");return}
    store.me=ph;
  }
  save();document.getElementById("modal").innerHTML="";render();
  var a=window._after;window._after=null;window._mode="in";if(a&&store.me!=="admin")openBuy(a);
}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML.replace(/"/g,"&quot;")}
function sell(pl){return Number(pl.sup)+PROFIT}
function planText(){return [["১ ঘণ্টা","np-p1"],["৩ ঘণ্টা","np-p3"],["৭ ঘণ্টা","np-p7"]].map(function(x){return x[0]+","+document.getElementById(x[1]).value.trim()}).join("\n")}
function P(id){return store.products.find(function(x){return x.id===id})}
function PL(id){for(var i=0;i<store.products.length;i++){var r=store.products[i].plans.find(function(x){return x.id===id});if(r)return r}return null}
function bn2en(s){return String(s).replace(/[০-৯]/g,function(c){return "০১২৩৪৫৬৭৮৯".indexOf(c)})}
function safeUrl(u){u=(u||"").trim();return /^https?:\/\//i.test(u)?u:""}
function linksFor(o){
  var p=P(o.pid),a=safeUrl(p&&p.panel),b=safeUrl(p&&p.vpn),h="";
  if(a)h+='<a class="lnk main" target="_blank" rel="noopener" href="'+esc(a)+'">প্যানেল ওয়েবসাইট খুলুন</a>';
  if(b)h+='<a class="lnk" target="_blank" rel="noopener" href="'+esc(b)+'">VPN লিংক খুলুন</a>';
  return h;
}
function pending(){return store.orders.filter(function(o){return o.status==="pending"}).length}
function render(){
  var adm=store.me==="admin";if(!adm&&tab==="admin")tab="shop";
  document.querySelectorAll("nav button").forEach(function(b){
    b.setAttribute("aria-selected",b.dataset.t===(tab==="buy"?"shop":tab));
    if(b.dataset.t==="admin"){b.style.display=adm?"":"none";b.innerHTML='<i>🛠</i><span>অ্যাডমিন</span>'+(pending()?'<em class="badge">'+pending()+'</em>':"")}
  });
  document.getElementById("view").innerHTML=tab==="shop"?shopV():tab==="keys"?keysV():tab==="acct"?acctV():tab==="buy"?buyV():adminV();
}
function shopV(){
  if(!store.products.length)return '<div class="card mute">এখনো কোনো প্যানেল নেই।</div>';
  return '<div class="grid">'+store.products.map(function(p){
    var min=Math.min.apply(null,p.plans.map(sell)),hue=(p.id*67)%360;
    return '<div class="pc">'+tile(p,"")
    +'<div class="pt">'+esc(p.name)+'</div>'
    +'<div class="prow"><span class="pill">'+p.plans.length+' টি সময়</span><span class="pr">৳'+min+'</span></div>'
    +'<button class="fs" data-info="'+p.id+'">ফাইল ও সেটআপ</button>'
    +'<button class="bn" data-buy="'+p.id+'">⚡ BUY NOW</button></div>'
  }).join("")+'</div>';
}
function acctV(){
  if(!store.me)return '<div class="card"><b>আপনি লগইন করা নেই</b><div class="mute" style="margin:6px 0 12px">লগইন করলে নিজের অর্ডার আর Key দেখতে পাবেন।</div><button class="btn" data-login="1">লগইন / একাউন্ট খুলুন</button></div>';
  var u=store.users.find(function(x){return x.ph===store.me});
  return '<div class="card"><div class="mute">লগইন করা আছে</div><b style="font-size:20px">'+esc(store.me==="admin"?"অ্যাডমিন":(u?u.name:store.me))+'</b>'+(store.me==="admin"?'':'<div class="mute">'+esc(store.me)+'</div>')+'<button class="btn alt" data-logout="1" style="margin-top:12px">লগআউট</button></div>';
}
function infoSheet(id){
  var p=P(id);
  document.getElementById("modal").innerHTML='<div class="sheet"><div><div class="row"><b style="font-size:19px">'+esc(p.name)+'</b><button class="btn alt" id="b-cancel">বন্ধ</button></div>'
  +'<p class="mute" style="margin:10px 0">'+esc(p.desc)+'</p>'
  +p.plans.map(function(pl){return '<div class="pay"><div class="row"><b>'+esc(pl.label)+'</b><span class="price">৳'+sell(pl)+'</span></div></div>'}).join("")
  +'<button class="bn" data-buy="'+p.id+'">⚡ BUY NOW</button></div></div>';
}
function keysV(){
  if(!store.me)return '<div class="card"><div class="mute">আপনার Key দেখতে আগে লগইন করুন।</div><button class="btn" data-login="1" style="margin-top:10px">লগইন / একাউন্ট খুলুন</button></div>';
  var mine=store.orders.filter(function(o){return o.user===store.me});
  if(!mine.length)return '<div class="card mute">এখনো কোনো অর্ডার নেই। দোকান থেকে একটা প্যানেল কিনুন।</div>';
  return mine.slice().reverse().map(function(o){
    var st=o.status==="approved"?'<span class="tag t-a">অ্যাপ্রুভড</span>':o.status==="rejected"?'<span class="tag t-r">বাতিল</span>':'<span class="tag t-p">অপেক্ষায়</span>';
    return '<div class="card"><div class="row"><b>'+esc(o.pname)+' · '+esc(o.plabel)+(o.qty>1?' × '+o.qty:'')+'</b>'+st+'</div>'
    +'<div class="mute">৳'+o.price+' · '+esc(o.method)+' · TrxID: '+esc(o.trx)+'</div>'
    +(o.status==="approved"?'<div class="key">'+esc(o.key)+'</div><button class="btn alt" style="margin-top:8px" data-copy="'+esc(o.key)+'">কপি করুন</button>'+linksFor(o):'')
    +(o.status==="pending"?'<div class="mute" style="margin-top:6px">অ্যাডমিন bKash চেক করে অ্যাপ্রুভ করলে এখানে Key দেখাবে।</div>':'')
    +(o.status==="rejected"?'<div class="mute" style="margin-top:6px">TrxID মেলেনি। সাপোর্টে যোগাযোগ করুন।</div>':'')
    +'</div>'
  }).join("");
}

  pend.forEach(function(o){

  +'<label>১ ঘণ্টার জন্য কত টাকা</label><input id="np-p1" type="number" inputmode="numeric" placeholder="সাপ্লায়ারের দাম, যেমন 10"><div class="mute" id="sv-p1"></div>'
  +'<label>৩ ঘণ্টার জন্য কত টাকা</label><input id="np-p3" type="number" inputmode="numeric" placeholder="সাপ্লায়ারের দাম, যেমন 25"><div class="mute" id="sv-p3"></div>'
  +'<label>৭ ঘণ্টার জন্য কত টাকা</label><input id="np-p7" type="number" inputmode="numeric" placeholder="সাপ্লায়ারের দাম, যেমন 50"><div class="mute" id="sv-p7"></div>'
  +'<div class="mute" style="margin:6px 0 10px">সেল প্রাইস অটো: সাপ্লায়ার + '+PROFIT+' টাকা</div>'

  h+='<h2>প্যানেল ও Key স্টক</h2>';
  store.products.forEach(function(p){
    h+='<div class="card"><div class="row"><b>'+esc(p.name)+'</b><button class="btn bad" data-del="'+p.id+'">মুছুন</button></div>'+photoRow(p)
    +'<label>প্যানেল ওয়েবসাইট লিংক</label><input id="pl-'+p.id+'" type="url" value="'+esc(p.panel||"")+'" placeholder="https://...">'
    +'<label>VPN লিংক</label><input id="vl-'+p.id+'" type="url" value="'+esc(p.vpn||"")+'" placeholder="https://...">'
    +'<button class="btn alt" style="margin-top:8px" data-savelinks="'+p.id+'">লিংক সেভ করুন</button>';
    p.plans.forEach(function(pl){
      h+='<div class="pay" style="margin-top:12px"><div class="row"><b>'+esc(pl.label)+'</b><span class="mute">সাপ্লায়ার ৳'+pl.sup+' → সেল ৳'+sell(pl)+' · স্টক '+pl.keys.length+'</span></div>'
      +'<div class="row" style="margin-top:8px;gap:8px"><input id="sp-'+pl.id+'" type="number" inputmode="numeric" value="'+pl.sup+'" style="flex:1"><button class="btn alt" data-saveprice="'+pl.id+'">দাম সেভ</button></div>'
      +'<textarea rows="2" id="ks-'+pl.id+'" placeholder="নতুন Key, প্রতি লাইনে একটা" style="margin-top:8px"></textarea>'
      +'<button class="btn alt" style="margin-top:8px" data-addkeys="'+pl.id+'">স্টকে যোগ করুন</button></div>';
    });
    h+='</div>';
  });
  h+='<h2>পেমেন্ট নাম্বার</h2><div class="card"><label>bKash</label><input id="pn-b" value="'+esc(store.pay.bkash)+'">'
  +'<label>Nagad</label><input id="pn-n" value="'+esc(store.pay.nagad)+'">'
  +'<label>নতুন অ্যাডমিন পাসওয়ার্ড (বদলাতে চাইলে)</label><input id="pn-pw" type="password" placeholder="ফাঁকা রাখলে বদলাবে না">'
  +'<button class="btn alt" id="pn-save" style="margin-top:10px">সেভ করুন</button></div>';
  return h;
}
function saveBuy(){var a=document.getElementById("b-from"),b=document.getElementById("b-trx");if(a)window._from=a.value;if(b)window._trx=b.value}
function openBuy(pid){
  var p=P(pid);window._pid=pid;window._sel=p.plans[0]?p.plans[0].id:null;window._method="bKash";window._qty=1;window._from="";window._trx="";
  document.getElementById("modal").innerHTML="";tab="buy";render();window.scrollTo(0,0);
}
function buyV(){
  var p=P(window._pid);if(!p){tab="shop";return shopV()}
  var pl=PL(window._sel),q=window._qty||1,hue=(p.id*67)%360,total=pl?sell(pl)*q:0;
  var n=window._method==="bKash"?store.pay.bkash:store.pay.nagad;
  return '<div class="card row" style="justify-content:flex-start;gap:14px">'+tile(p,"mini")+'<div><b style="font-size:19px">'+esc(p.name)+'</b><div class="mute">গেম / প্যানেল</div></div></div>'
  +'<div class="card"><div class="stp"><i>1</i><b>সময় বেছে নিন</b></div><div class="pg">'
  +p.plans.map(function(x){return '<button class="chip'+(x.id===window._sel?' on':'')+'" data-plan="'+x.id+'"><i class="dot"></i><span>'+esc(x.label)+'</span><b>৳'+sell(x)+'</b></button>'}).join("")
  +'</div><button class="vid" data-info="'+p.id+'">▶ APK ও সেটআপ ভিডিও</button></div>'
  +'<div class="card row"><b style="font-size:18px">Quantity</b><div class="qty"><button data-qty="-1">−</button><span>'+q+'</span><button data-qty="1">+</button></div></div>'
  +'<div class="card"><div class="stp"><i>2</i><b>পেমেন্ট মেথড</b></div>'
  +'<div class="ip"><div class="ipt"><b>bKash · নগদ</b><div class="mute">Instant Pay</div></div><div class="ipb">INSTANT PAY</div></div>'
  +'<div class="row" style="gap:6px;margin-top:12px"><button class="btn'+(window._method==="bKash"?'':' alt')+'" data-m="bKash" style="flex:1">bKash</button><button class="btn'+(window._method==="Nagad"?'':' alt')+'" data-m="Nagad" style="flex:1">Nagad</button></div>'
  +'<div class="pay"><b>৳'+total+'</b> টাকা Send Money করুন:<br><b>'+esc(n)+'</b></div>'
  +'<label>যে নাম্বার থেকে পাঠিয়েছেন</label><input id="b-from" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" value="'+esc(window._from||"")+'">'
  +'<label>TrxID</label><input id="b-trx" placeholder="যেমন: 9K3L2M1N0P" autocapitalize="characters" value="'+esc(window._trx||"")+'">'
  +'<div class="mute" style="margin-top:12px">প্রোডাক্ট কিনতে আপনার প্রয়োজন: <b style="color:var(--ink)">৳'+total+'</b></div>'
  +'<div id="b-msg"></div><button class="bn" id="b-ok" style="padding:14px;font-size:17px;margin-top:10px">⚡ BUY NOW</button></div>'
  +'<div class="card"><b style="font-size:18px">Rules &amp; Conditions</b><div class="stp" style="padding:0;margin:10px 0 6px"></div>'
  +'<div class="rule">✅ অর্ডার অ্যাপ্রুভ হলে আমার Key পেজে Key পাবেন</div><div class="rule">✅ সঠিক TrxID দিন, একই TrxID দুইবার চলবে না</div><div class="rule">✅ সমস্যা হলে সাপোর্টে যোগাযোগ করুন</div></div>';
}
function showMsg(id,t,c){document.getElementById(id).innerHTML='<div class="msg '+c+'">'+t+'</div>'}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.t){tab=d.t;render();return}
  if(d.login){window._after=null;window._mode="in";openAuth();return}
  if(d.logout){store.me=null;tab="shop";save();render();return}
  if(d.at){window._mode=d.at;openAuth();return}
  if(t.id==="a-ok"){doAuth();return}
  if(d.info){infoSheet(Number(d.info));return}
  if(d.buy){if(!store.me){window._after=Number(d.buy);window._mode="in";openAuth();return}openBuy(Number(d.buy));return}
  if(d.plan){saveBuy();window._sel=Number(d.plan);render();return}
  if(d.qty){saveBuy();window._qty=Math.max(1,Math.min(10,(window._qty||1)+Number(d.qty)));render();return}
  if(d.m){saveBuy();window._method=d.m;render();return}
  if(t.id==="b-cancel"){document.getElementById("modal").innerHTML="";return}
  if(t.id==="b-ok"){
    var pl=PL(window._sel),p=P(window._pid);
    var from=bn2en(document.getElementById("b-from").value.trim());
    var trx=document.getElementById("b-trx").value.trim().toUpperCase();
    if(!pl){showMsg("b-msg","আগে একটা সময় বেছে নিন।","e");return}
    if(!/^01\d{9}$/.test(from)){showMsg("b-msg","সঠিক ১১ ডিজিটের নাম্বার দিন।","e");return}
    if(trx.length<6){showMsg("b-msg","TrxID কমপক্ষে ৬ অক্ষরের হতে হবে।","e");return}
    if(store.orders.some(function(o){return o.trx===trx})){showMsg("b-msg","এই TrxID আগেই ব্যবহার হয়েছে। অন্য TrxID দিন।","e");return}
    store.orders.push({id:Date.now(),pid:p.id,plid:pl.id,pname:p.name,plabel:pl.label,price:sell(pl)*(window._qty||1),qty:window._qty||1,method:window._method,from:from,trx:trx,status:"pending",key:null,user:store.me});
    save();document.getElementById("modal").innerHTML="";tab="keys";render();return
  }
  if(d.copy){try{navigator.clipboard.writeText(d.copy);t.textContent="কপি হয়েছে"}catch(x){}return}
  if(d.app){
    var o=store.orders.find(function(x){return x.id===Number(d.app)}),pl2=PL(o.plid),k=null;
    var inp0=document.querySelector('[data-mkey="'+o.id+'"]'),typed=inp0?inp0.value.trim():"";if(typed){k=typed}else if(pl2&&pl2.keys.length>=(o.qty||1)){k=pl2.keys.splice(0,o.qty||1).join("\n")}
    else{var inp=document.querySelector('[data-mkey="'+o.id+'"]');k=inp?inp.value.trim():"";if(!k){inp&&inp.focus();return}}
    o.status="approved";o.key=k;save();render();return
  }
  if(d.rej){store.orders.find(function(x){return x.id===Number(d.rej)}).status="rejected";save();render();return}
  if(d.addkeys){
    var pl3=PL(Number(d.addkeys));
    document.getElementById("ks-"+pl3.id).value.split("\n").map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){pl3.keys.push(s)});
    save();render();return
  }
  if(d.saveprice){var q=PL(Number(d.saveprice)),nv=Number(bn2en(document.getElementById("sp-"+q.id).value));if(nv>0){q.sup=nv;save();render()}return}
  if(d.savelinks){
    var sp=P(Number(d.savelinks));
    sp.panel=document.getElementById("pl-"+sp.id).value.trim();
    sp.vpn=document.getElementById("vl-"+sp.id).value.trim();
    save();t.textContent="সেভ হয়েছে";return
  }
  if(d.rmimg){P(Number(d.rmimg)).img="";save();render();return}
  if(d.del){if(confirm("এই প্যানেল মুছবেন?")){store.products=store.products.filter(function(x){return x.id!==Number(d.del)});save();render()}return}
  if(t.id==="np-add"){
    var nm=document.getElementById("np-name").value.trim(),pid=Date.now();
    var plans=bn2en(planText()).split("\n").map(function(l){
      var i=l.lastIndexOf(",");if(i<0)return null;var lab=l.slice(0,i).trim(),pr=Number(l.slice(i+1).trim());
      return lab&&pr?{label:lab,sup:pr}:null}).filter(Boolean);
    if(!nm||!plans.length){showMsg("np-msg","নাম আর অন্তত একটা সময়ের দাম দিন।","e");return}
    store.products.push({id:pid,name:nm,desc:document.getElementById("np-desc").value.trim(),panel:document.getElementById("np-panel").value.trim(),vpn:document.getElementById("np-vpn").value.trim(),img:(function(){var m=window._newImg||"";window._newImg=null;return m})(),plans:plans.map(function(x,i){return {id:pid*10+i,label:x.label,sup:x.sup,keys:[]}})});
    save();render();return
  }
  if(t.id==="pn-save"){store.pay.bkash=document.getElementById("pn-b").value.trim();store.pay.nagad=document.getElementById("pn-n").value.trim();var npw=document.getElementById("pn-pw").value;if(npw&&npw.length>=4)store.adminPass=H(npw);save();t.textContent="সেভ হয়েছে";return}
});
document.addEventListener("input",function(e){var m=/^np-p(\d)$/.exec(e.target.id);if(m){var v=Number(bn2en(e.target.value));document.getElementById("sv-p"+m[1]).textContent=v>0?"সেল প্রাইস অটো: ৳"+(v+PROFIT):""}});
function tile(p,c){var hue=(p.id*67)%360;
  if(p.img)return '<div class="tile hasimg '+c+'"><img src="'+p.img+'" alt=""></div>';
  return '<div class="tile '+c+'" style="background:radial-gradient(circle at 30% 20%,hsl('+hue+',70%,38%),hsl('+((hue+40)%360)+',60%,10%))"><span>'+esc(c?p.name.slice(0,2):p.name)+'</span></div>'}
function photoRow(p){return '<div class="row" style="justify-content:flex-start;gap:12px;margin:10px 0">'+tile(p,"mini")+'<div style="flex:1"><div class="mute">প্যানেলের ছবি</div><input id="im-'+p.id+'" type="file" accept="image/*">'+(p.img?'<button class="btn bad" data-rmimg="'+p.id+'" style="margin-top:6px">ছবি মুছুন</button>':'')+'</div></div>'}
function compress(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=480,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.8))};im.onerror=function(){cb(null)};im.src=r.result};r.readAsDataURL(file)}
function toast(m){var x=document.getElementById("toast");if(!x){x=document.createElement("div");x.id="toast";document.body.appendChild(x)}x.textContent=m;x.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(function(){x.style.display="none"},3500)}
function onFile(e){var t=e.target;if(!t||t.type!=="file"||!t.files||!t.files[0]||t._busy===t.files[0])return;
  var file=t.files[0];t._busy=file;toast("ছবি লোড হচ্ছে...");
  compress(file,function(u){
    if(!u){toast("ছবিটা পড়া যায়নি, অন্য ছবি দিন");return}
    if(t.id==="np-img"){window._newImg=u;document.getElementById("np-prev").innerHTML='<img src="'+u+'" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:12px;margin-top:8px">';toast("ছবি যোগ হয়েছে ✓ এবার প্যানেল যোগ করুন")}
    else if(t.id.indexOf("im-")===0){var pp=P(Number(t.id.slice(3)));pp.img=u;save();render();toast("ছবি যোগ হয়েছে ✓")}
  })}
document.addEventListener("change",onFile);
document.addEventListener("input",onFile);
load();fix();render();
